set -g mouse on
setw -g mode-keys vi
set -g status-keys vi

# ── True color support ──
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",ghostty:RGB"

# ── Passthrough for image sequences (Ghostty/Kitty graphics) ──
set -g allow-passthrough on
set -as terminal-overrides ',xterm-ghostty:Tc'

# ── Tokyo Night status bar base ──
set -g status-style "bg=#24283b,fg=#c0caf5"
set -g status-position bottom
set -g status-interval 5

# ── Pane borders ──
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# ── Message styling ──
set -g message-style "bg=#292e42,fg=#7aa2f7"
set -g message-command-style "bg=#292e42,fg=#7aa2f7"

# ── Window/tab bar appearance ──
set -g window-status-separator ""

# ── Plugins ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configurations
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
